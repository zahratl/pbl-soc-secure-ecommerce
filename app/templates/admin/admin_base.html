<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel - Kuro Wear{% endblock %}</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts Inter & Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #FBF8FF;
            color: #1A1B22;
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .admin-sidebar {
            width: 256px;
            background: #F5F2EB;
            border-right: 1px solid #EAE6DF;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 32px 20px;
            z-index: 100;
        }

        .admin-profile-box {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
        }

        .admin-avatar {
            width: 40px;
            height: 40px;
            background: #9E0B0F;
            color: #FFFFFF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .admin-info h2 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 15px;
            color: #161616;
            margin: 0;
        }

        .admin-info p {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 12px;
            color: #737373;
            margin: 0;
        }

        .admin-nav-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
            list-style: none;
            padding: 0;
            margin: 0 0 auto 0;
        }

        .admin-nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 500;
            font-size: 14px;
            color: #444444;
            text-decoration: none;
            border-radius: 2px;
            transition: all 0.2s ease;
        }

        .admin-nav-link:hover {
            background: rgba(0, 0, 0, 0.04);
            color: #161616;
        }

        .admin-nav-link.active {
            background: #161616;
            color: #FFFFFF;
            font-weight: 600;
        }

        .btn-admin-logout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px;
            background: #E3E3E3;
            color: #BA1A1A;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.9px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 2px;
            transition: background 0.2s ease;
        }

        .btn-admin-logout:hover {
            background: #D4D4D4;
        }

        /* MAIN CONTENT WRAPPER */
        .admin-content-wrapper {
            margin-left: 256px;
            flex-grow: 1;
            padding: 40px 48px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="admin-sidebar">
        <div>
            <!-- Admin Profile Header -->
            <div class="admin-profile-box">
                <div class="admin-avatar">
                    <i class="bi bi-person-fill"></i>
                </div>
                <div class="admin-info">
                    <h2>{{ current_user.name if current_user.is_authenticated else 'Admin Kuro' }}</h2>
                    <p>Administrator Utama</p>
                </div>
            </div>

            <!-- Navigation Links -->
            <ul class="admin-nav-menu">
                <li>
                    <a href="{{ url_for('admin.dashboard') }}" class="admin-nav-link {{ 'active' if request.endpoint == 'admin.dashboard' else '' }}">
                        <i class="bi bi-grid-1x2"></i> Dashboard
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('admin.products') }}"
                    class="admin-nav-link {{ 'active' if request.endpoint in ['admin.products', 'admin.product_create', 'admin.product_edit', 'admin.product_stock'] else '' }}">
                        <i class="bi bi-box-seam"></i>
                        Produk & Stok
                    </a>
                </li>
                <li>
                    <a href="#" class="admin-nav-link">
                        <i class="bi bi-bag-check"></i> Pesanan & Transaksi
                    </a>
                </li>              
                <li>
                    <a href="{{ url_for('admin.users_index') }}"
                    class="admin-nav-link {{ 'active' if request.endpoint in ['admin.users_index', 'admin.user_edit'] else '' }}">
                        <i class="bi bi-people"></i> Akun
                    </a>
                </li>
            </ul>
        </div>

        <!-- Logout Button -->
        <div>
            <a href="{{ url_for('auth.logout') }}" class="btn-admin-logout">
                <i class="bi bi-box-arrow-left" style="font-size: 18px;"></i> Logout
            </a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="admin-content-wrapper">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
