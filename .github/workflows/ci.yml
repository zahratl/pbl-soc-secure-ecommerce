name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cek file sensitif tidak ter-commit
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|rclone\.conf$'; then
            echo "File sensitif ter-commit"; exit 1
          fi

      - name: Cek sintaks Python (jika ada)
        run: |
          if ls app/*.py >/dev/null 2>&1; then
            python -m compileall app
          else
            echo "Belum ada kode Python"
          fi

      - name: Build image Docker (jika ada Dockerfile)
        run: |
          if [ -f docker/Dockerfile ]; then
            docker build -f docker/Dockerfile -t pbl-soc-app:ci .
          else
            echo "Belum ada Dockerfile"
          fi
